name: Deploy API Worker
on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      YT_KEY: ${{ secrets.RAPIDAPI_KEY }}
      GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Workers
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: api
          wranglerVersion: "4.45.0"
      - name: Send the Stripe key to the Worker (kept secret, never in the code)
        if: ${{ env.CF_TOKEN != '' && env.STRIPE_KEY != '' }}
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: printf '%s' "$STRIPE_KEY" | npx --yes wrangler@4.45.0 secret put STRIPE_SECRET_KEY
      - name: Send the RapidAPI key to the Worker (kept secret, never in the code)
        if: ${{ env.CF_TOKEN != '' && env.YT_KEY != '' }}
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: printf '%s' "$YT_KEY" | npx --yes wrangler@4.45.0 secret put RAPIDAPI_KEY
      - name: Send the Groq key to the Worker (kept secret, never in the code)
        if: ${{ env.CF_TOKEN != '' && env.GROQ_KEY != '' }}
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: printf '%s' "$GROQ_KEY" | npx --yes wrangler@4.45.0 secret put GROQ_API_KEY
