name: Gemini check (manual)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      K: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Key present
        run: |
          [ -n "$K" ] && echo "key length ${#K}" || echo "NO KEY"
      - name: Flash models this key can use
        run: |
          curl -s "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" -H "x-goog-api-key: $K" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('error') or [m['name'] for m in d.get('models',[]) if 'flash' in m['name']])"
      - name: Audio test per model
        run: |
          python3 - <<'P'
          import base64,io,json,math,os,struct,time,wave,urllib.request
          b=io.BytesIO();w=wave.open(b,'wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(16000)
          w.writeframes(b''.join(struct.pack('<h',int(8000*math.sin(2*math.pi*(220+i/400)*i/16000))) for i in range(16000*5)));w.close()
          a=base64.b64encode(b.getvalue()).decode()
          for m in ["gemini-3.5-flash","gemini-3.5-flash","gemini-3.8-flash","gemini-3.6-flash","gemini-3.1-flash-lite"]:
            body=json.dumps({"contents":[{"role":"user","parts":[{"inline_data":{"mime_type":"audio/wav","data":a}},{"text":"Describe this sound mood. JSON only: {\"mood\":\"...\",\"energy\":0.0}"}]}],"generationConfig":{"responseMimeType":"application/json","maxOutputTokens":2000,"thinkingConfig":{"thinkingLevel":"low"}}}).encode()
            r=urllib.request.Request("https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent"%m,data=body,headers={"Content-Type":"application/json","x-goog-api-key":os.environ["K"]})
            t=time.time()
            try:
              d=json.loads(urllib.request.urlopen(r,timeout=40).read());print(m,"OK",round(time.time()-t,1),"s",json.dumps(d["candidates"][0])[:220])
            except Exception as e:
              print(m,"ERR",round(time.time()-t,1),"s",str(e)[:60],getattr(e,'read',lambda:b'')()[:160])
          P
