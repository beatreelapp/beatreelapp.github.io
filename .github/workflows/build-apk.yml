name: Build Android app
on:
  push:
    branches: [main]
    paths: ["app/**", "index.html", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (already on the runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Copy the website into the app (works offline)
        run: |
          mkdir -p app/www
          rsync -a --exclude /.git --exclude /.github --exclude /app --exclude /api \
            --exclude /BeatReel.apk --exclude /diag.html --exclude /sw.js ./ app/www/
          du -sh app/www

      - name: Make the Android project
        working-directory: app
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build the test app (BeatReel Test, installs next to the old one)
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build the signed app (only when the KEYSTORE_PASSWORD secret exists)
        if: ${{ env.KS_PASS != '' }}
        working-directory: app/android
        run: |
          ENC="$GITHUB_WORKSPACE/app/signing/beatreel.keystore.enc"
          export KS_FILE="$RUNNER_TEMP/beatreel.keystore"
          export KS_ALIAS=beatreel
          if [ ! -f "$ENC" ]; then
            echo "First signed build: making the app key (kept encrypted in the repo)"
            keytool -genkeypair -v -storetype PKCS12 -keystore "$KS_FILE" -alias beatreel \
              -keyalg RSA -keysize 4096 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=BeatReel, O=BeatReel, C=BE"
            mkdir -p "$(dirname "$ENC")"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$KS_FILE" -out "$ENC" -pass env:KS_PASS
            touch "$RUNNER_TEMP/new_key"
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$ENC" -out "$KS_FILE" -pass env:KS_PASS
          fi
          keytool -list -keystore "$KS_FILE" -storepass "$KS_PASS" -alias beatreel | grep -i fingerprint || true
          ./gradlew --no-daemon assembleRelease
          rm -f "$KS_FILE"

      - name: Save the encrypted key in the repo (first signed build only)
        if: ${{ env.KS_PASS != '' }}
        run: |
          if [ -f "$RUNNER_TEMP/new_key" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/signing/beatreel.keystore.enc
            git commit -m "Add encrypted app signing key [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish the files (download links for the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk BeatReel-test.apk
          gh release view apk-test >/dev/null 2>&1 || gh release create apk-test --title "BeatReel test app" --notes "Test build. Installs next to the normal app." --prerelease
          gh release upload apk-test BeatReel-test.apk --clobber
          if [ -f app/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp app/android/app/build/outputs/apk/release/app-release.apk BeatReel-app.apk
            gh release view apk >/dev/null 2>&1 || gh release create apk --title "BeatReel Android app" --notes "Signed app."
            gh release upload apk BeatReel-app.apk --clobber
          fi
